[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supabase-rls-audit"
version = "0.1.0"
description = "Find Row Level Security gaps in Supabase projects: static migration analysis and live cross-user probes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eneas Romero Barroso" }]
keywords = ["supabase", "postgres", "rls", "security", "audit"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
supabase-rls-audit = "rlsaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
